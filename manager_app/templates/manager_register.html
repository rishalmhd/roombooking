<!doctype html>
<html lang="en">
<head>
    <title>Manager Registration</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="card shadow-lg p-4" style="max-width: 600px; width: 100%; border-radius: 15px;">

        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold">Manager Registration</h2>
            <p class="text-muted">Create your account to manage your rooms</p>
        </div>

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}

            <table class="table table-borderless align-middle">
                {{ form.as_table }}
            </table>

            <button class="btn btn-primary w-100">Register</button>

            <!-- <p class="text-center text-muted mt-3">
                Already have an account?
                <a href="{% url 'customer_login' %}" class="fw-semibold">Sign In</a>
            </p> -->
        </form>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
