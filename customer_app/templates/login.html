<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - YourCompany</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa; /* Light neutral background */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 1rem;
            padding: 2rem;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .login-card .form-control:focus {
            box-shadow: none;
            border-color: #6C63FF;
        }
        .login-card .btn-primary {
            background-color: #6C63FF;
            border-color: #6C63FF;
        }
        .login-card .btn-primary:hover {
            background-color: #574fd6;
            border-color: #574fd6;
        }
        .input-group-text {
            background: transparent;
            border-right: 0;
        }
        .form-control {
            border-left: 0;
        }
        .forgot-link {
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <h2 class="text-center mb-4 fw-bold">Welcome Back</h2>
                    <p class="text-center text-muted mb-4">Login to your account</p>
                    <form method="POST" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                {{ form.username }}
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                {{ form.password }}
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{% url 'forgot_password' %}" class="forgot-link text-decoration-none text-primary">
                            Forgot Password?
                        </a>
                    </div>
                    <p class="text-center text-muted mt-4 mb-0">&copy; {{ current_year }} Booking.Com. All rights reserved.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
