<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            border-radius: 1rem;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .btn-warning {
            font-weight: 600;
        }
        table td {
            padding: 8px 0;
        }
    </style>
</head>
<body>

<div class="card p-4" style="width: 420px;">
    <h3 class="text-center mb-3 fw-bold">Forgot Password</h3>
    <p class="text-center text-muted">Please provide your registered details</p>

    <form method="POST">
        {% csrf_token %}
        <table class="w-100">
            <tr>
                <td><strong>Email:</strong></td>
                <td><input type="email" name="email" class="form-control" placeholder="Enter email" required></td>
            </tr>
            <tr>
                <td><strong>Mobile No:</strong></td>
                <td><input type="text" name="mobile" class="form-control" placeholder="Enter mobile number" required></td>
            </tr>
        </table>

        <button class="btn btn-warning w-100 mt-3">Submit</button>
    </form>

    <div class="text-center mt-3">
        <a href="{% url 'customer_login' %}" class="text-decoration-none">⬅ Back to Login</a>
    </div>
</div>

</body>
</html>
