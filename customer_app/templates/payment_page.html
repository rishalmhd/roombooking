<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background: #f4f6f9;
        }
        .pay-card {
            max-width: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 35px;
        }
        .pay-title {
            font-weight: 600;
            color: #2d3436;
        }
        .summary-label {
            font-size: 14px;
            color: #636e72;
        }
        .summary-value {
            font-size: 18px;
            font-weight: 600;
        }
        .btn-pay {
            background: #28a745;
            border: none;
            padding: 12px;
            font-size: 17px;
            border-radius: 8px;
        }
        .btn-pay:hover {
            background: #218838;
        }
    </style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="pay-card">

        <h3 class="mb-4 pay-title text-center">Confirm Your Payment</h3>

        <div class="mb-3">
            <p class="summary-label mb-1">Order ID</p>
            <p class="summary-value">{{ rzp_order_id }}</p>
        </div>

        <div class="mb-4">
            <p class="summary-label mb-1">Amount</p>
            <p class="summary-value text-success">₹{{ amount|floatformat:2 }}</p>
        </div>

        <button id="rzp-button1" class="btn btn-pay w-100">
            Proceed to Pay
        </button>

    </div>

    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        var options = {
            "key": "{{ rzp_key_id }}",
            "amount": "{{ amount }}",
            "currency": "INR",
            "name": "Hotel Booking",
            "description": "Room Payment",
            "order_id": "{{ rzp_order_id }}",

            "prefill": {
                "name": "Guest User",
                "email": "guest@example.com",
                "contact": "9999999999"
            },

            "theme": {
                "color": "#3399cc"
            },

            "handler": function (response) {
                fetch("{% url 'payment_verify' %}", {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: new URLSearchParams({
                        "razorpay_payment_id": response.razorpay_payment_id,
                        "razorpay_order_id": response.razorpay_order_id,
                        "razorpay_signature": response.razorpay_signature
                    })
                }).then(() => {
                    window.location.href = "{% url 'checkout_done' %}";
                });
            }
        };

        var rzp = new Razorpay(options);

        document.getElementById('rzp-button1').onclick = function(e) {
            rzp.open();
            e.preventDefault();
        };
    </script>

</body>
</html>
