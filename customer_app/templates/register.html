<!doctype html>
<html lang="en">
<head>
    <title>Customer Registration</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <style>
        body {
            background-color: #f7f7f7;
            font-family: 'Inter', sans-serif;
        }

        .register-card {
            max-width: 600px;
            width: 100%;
            border-radius: 18px;
            background: #ffffff;
            padding: 40px;
            box-shadow: 0px 8px 22px rgba(0,0,0,0.08);
        }

        /* Updated to GREEN */
        .btn-airbnb {
            background-color: #28a745; /* Green */
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            transition: 0.3s ease;
        }

        .btn-airbnb:hover {
            background-color: #218838; /* Darker green hover */
        }
    </style>
</head>

<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="register-card">

        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Manager Registration</h2>
            <p class="text-muted">Create your account to manage your rooms</p>
        </div>

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}

            <table class="table table-borderless align-middle">
                {{ form.as_table }}
            </table>

            <button class="btn-airbnb mt-2">Register</button>

            <!-- Optional login link -->
            
            <p class="text-center text-muted mt-3">
                Already have an account?
                <a href="{% url 'customer_login' %}" class="fw-semibold text-success">Sign In</a>
            </p>
            
        </form>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>

</body>
</html>
